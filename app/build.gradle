plugins {
    id 'com.android.application'
}

android {
    namespace 'se.radiocast'
    compileSdk 34

    defaultConfig {
        applicationId 'se.radiocast'
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName '1.6'
    }

    signingConfigs {
        // Fast nyckel, så att nya versioner kan installeras ovanpå den gamla.
        debug {
            storeFile file('radiocast.keystore')
            storePassword 'radiocast'
            keyAlias 'radiocast'
            keyPassword 'radiocast'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Fast-starting stream player (Google Media3 / ExoPlayer), with HLS support.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
}
