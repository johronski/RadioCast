name: Bygg APK

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bygg appen
        run: gradle assembleDebug --no-daemon

      - name: Döp om APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RadioCast.apk

      - name: Publicera som release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: RadioCast (bygge ${{ github.run_number }})
          body: Ladda ner RadioCast.apk nedan och öppna den på telefonen.
          files: RadioCast.apk
