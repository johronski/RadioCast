name: Probe
on:
  push:
    branches: [probe]
    paths: ['.github/**', 'app/src/main/**']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: |
          npm i playwright@1.56.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          git fetch -q --depth 1 origin main && git checkout FETCH_HEAD -- docs
          (cd docs && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 1
          timeout 240 node .github/probe/icy.mjs > probe-result.txt 2>&1 || true
      - run: |
          git config user.name RadioCast; git config user.email radiocast@users.noreply.github.com
          git reset -q docs; git checkout -q -- docs 2>/dev/null || true
          git add probe-result.txt; git commit -m "probe result [skip ci]"; git push
