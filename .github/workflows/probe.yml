name: Probe
on:
  push:
    branches: [probe]
    paths: ['.github/probe/**', '.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/probe/probe.py > probe-result.txt 2>&1 || true
      - run: |
          git config user.name RadioCast; git config user.email radiocast@users.noreply.github.com
          git add probe-result.txt; git commit -m "probe result [skip ci]"; git push
