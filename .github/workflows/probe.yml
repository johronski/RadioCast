name: Probe
on:
  push:
    branches: [probe]
    paths: ['.github/**', 'app/src/main/**']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm i playwright@1.56.0 >/dev/null 2>&1 && npx playwright install --with-deps webkit >/dev/null 2>&1
          (cd docs && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 1
          TZ=Europe/Stockholm node .github/probe/web.mjs > probe-result.txt 2>&1 || true
      - run: |
          git config user.name RadioCast; git config user.email radiocast@users.noreply.github.com
          git add probe-result.txt; git commit -m "probe result [skip ci]"; git push
