name: Probe
on:
  push:
    branches: [probe]
    paths: ['.github/**', 'app/src/main/**', 'tools/**']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: |
          (node tools/build-sources.mjs; echo EXIT $?; git diff --stat; git diff meta-sources.json) > probe-result.txt 2>&1
          git checkout -- meta-sources.json docs app/src/main/assets
      - run: |
          git config user.name RadioCast; git config user.email radiocast@users.noreply.github.com
          git add probe-result.txt; git commit -m "probe result [skip ci]"; git push
