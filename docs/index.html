<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RadioCast</title>
<meta name="description" content="Webbradio i telefonen, med låtinformation och castning till Chromecast från Chrome.">
<meta name="theme-color" content="#F5F4F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1E22" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RadioCast">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css?v=4.5">
</head>
<body>
<div class="app">

  <header class="top">
    <h1>RadioCast</h1>
    <!-- Where the sound goes: the phone, or a speaker (filled while casting). Tap to choose. -->
    <button id="outBtn" class="chip" type="button">
      <span class="spinner" id="outSpin" hidden></span>
      <svg class="ico sm" id="outIcon" viewBox="0 0 24 24"><use href="#i-phone"/></svg>
      <span id="outText">Telefon</span>
      <svg class="ico sm" viewBox="0 0 24 24"><use href="#i-chevron"/></svg>
    </button>
    <button id="menuBtn" class="iconbtn" type="button" aria-label="Meny">
      <svg class="ico" viewBox="0 0 24 24"><use href="#i-more"/></svg>
    </button>
  </header>

  <button id="searchBar" class="searchbar" type="button">
    <svg class="ico" viewBox="0 0 24 24"><use href="#i-search"/></svg>
    <span>Sök kanal, land eller genre</span>
  </button>

  <div class="listhead" id="listhead" hidden>
    <div class="pills" role="tablist" aria-label="Ordning">
      <button id="orderCountry" class="pill" role="tab" type="button">Land</button>
      <button id="orderOwn" class="pill" role="tab" type="button">Egen ordning</button>
    </div>
    <button id="editBtn" class="textbtn" type="button">Klar</button>
  </div>

  <main id="stations" class="stations" aria-live="polite"></main>

  <section id="empty" class="empty" hidden>
    <p class="empty-title">Inga kanaler än</p>
    <p class="muted">Sök efter en kanal och lägg till den i din lista.</p>
    <button id="emptySearch" class="btn accent" type="button">Sök kanaler</button>
  </section>

  <button id="installBtn" class="textbtn install" type="button" hidden>
    <svg class="ico sm" viewBox="0 0 24 24"><use href="#i-plus"/></svg> Lägg RadioCast på hemskärmen
  </button>

  <div class="spacer"></div>
</div>

<!-- Now playing -->
<section id="np" class="np" hidden>
  <div class="np-row">
    <div class="logo-wrap np-logo" id="npLogo"></div>
    <button id="npText" class="np-text" type="button">
      <span class="np-channel"><span id="npLive" class="live" hidden><i></i>LIVE</span><span id="npName"></span><svg class="ico sm np-more" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chevron"/></svg></span>
      <span id="npTitle" class="np-title" hidden><svg class="ico sm accent" viewBox="0 0 24 24"><use href="#i-note"/></svg><span></span></span>
      <span id="npArtist" class="np-artist" hidden><svg class="ico sm" viewBox="0 0 24 24"><use href="#i-person"/></svg><span></span></span>
      <span id="npStatus" class="np-status"></span>
    </button>
    <button id="npButton" class="playbtn" type="button" aria-label="Spela">
      <svg class="ring" viewBox="0 0 48 48" hidden><circle cx="24" cy="24" r="21"/></svg>
      <svg class="ico" id="npIcon" viewBox="0 0 24 24"><use href="#i-play"/></svg>
    </button>
  </div>
  <div class="vol">
    <svg class="ico sm" viewBox="0 0 24 24"><use href="#i-volume"/></svg>
    <input id="volume" type="range" min="0" max="100" value="100" aria-label="Volym">
  </div>
</section>

<!-- Search -->
<section id="search" class="search" hidden aria-label="Sök kanaler">
  <div class="search-top">
    <button id="searchBack" class="iconbtn" type="button" aria-label="Tillbaka"><svg class="ico" viewBox="0 0 24 24"><use href="#i-back"/></svg></button>
    <input id="query" type="search" placeholder="t.ex. sverige p3, fransk rap, techno" autocomplete="off" enterkeyhint="search">
  </div>
  <div id="recent" class="chiprow" hidden></div>
  <div id="genres" class="chiprow"></div>
  <p id="info" class="info muted">Välj en genre eller skriv ett namn.</p>
  <ul id="results" class="results"></ul>
  <button id="addLink" class="textbtn addlink" type="button"><svg class="ico sm" viewBox="0 0 24 24"><use href="#i-plus"/></svg> Lägg till med egen länk</button>
  <div class="spacer"></div>
</section>

<div id="snack" class="snack" hidden role="status"><span id="snackText"></span><button id="snackAction" class="snack-action" type="button" hidden></button></div>

<div id="scrim" class="scrim" hidden></div>
<section id="sheet" class="sheet" hidden role="dialog" aria-modal="true">
  <div class="sheet-head"><span class="handle"></span><button id="sheetClose" class="iconbtn close" type="button" aria-label="Stäng"><svg class="ico" viewBox="0 0 24 24"><use href="#i-close"/></svg></button></div>
  <div id="sheetBody" class="sheet-body"></div>
</section>

<audio id="audio" preload="none"></audio>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18h2"/></symbol>
    <symbol id="i-speaker" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><circle cx="12" cy="14" r="3.5"/><path d="M12 7h.01"/></symbol>
    <symbol id="i-group" viewBox="0 0 24 24"><rect x="2.5" y="6" width="9" height="13" rx="2"/><rect x="12.5" y="6" width="9" height="13" rx="2"/><circle cx="7" cy="14" r="2"/><circle cx="17" cy="14" r="2"/></symbol>
    <symbol id="i-cast" viewBox="0 0 24 24"><path d="M2 16a5 5 0 0 1 5 5M2 12a9 9 0 0 1 9 9M2 8.5V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/><path d="M2 20h.01"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="19" r="1.4" fill="currentColor"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
    <symbol id="i-person" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></symbol>
    <symbol id="i-grip" viewBox="0 0 24 24"><path d="M8 7h8M8 12h8M8 17h8"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  </defs>
</svg>

<script type="module" src="js/app.js?v=4.5"></script>
</body>
</html>
